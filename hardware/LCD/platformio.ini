[env:esp32dev]
platform = espressif32
board = esp32dev       ; Đã đổi từ s3 sang mạch esp32 thường
framework = arduino

; Tốc độ nạp và Serial
monitor_speed = 115200
upload_speed = 921600

; --- CẤU HÌNH PHẦN CỨNG CHO MÀN HÌNH ST7789 TRÊN ESP32 THƯỜNG ---
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=15
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000

; --- TỰ ĐỘNG TẢI THƯ VIỆN MÀN HÌNH ---
lib_deps = 
    bodmer/TFT_eSPI @ ^2.5.43