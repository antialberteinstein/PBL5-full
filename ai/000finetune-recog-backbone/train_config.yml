# Fine-tune Config cho ResNet50 (InsightFace + LoRA)

# --- Model & Dataset Paths ---
model_path: "models/pretrained/r50-ms1mv3.pth"
dataset_train_path: "dataset/train"
save_dir: "models/finetuned"

# --- Training Hyperparameters ---
batch_size: 64
epochs: 30 # Cần 30 epoch cho 2 chu kỳ Cosine đầy đủ (mỗi chu kỳ T_0=5 epoch)
head_warmup_epochs: 2 
learning_rate: 0.001 # LR cao hơn để Cosine có đủ phạm vi dao động từ 0.001 -> 1e-6
weight_decay: 0.005 
optimizer: "adamw" 
num_workers: 0 
fp16: true 
gradient_acc: 1 

# --- LoRA Hyperparameters ---
use_lora: true
lora_r: 16 # r=16: đủ sức chứa mà không gây overfit (r=64 đã gây sụt lfw xuống 0.942)
lora_alpha: 32 
lora_dropout: 0.15 # Tăng nhẹ dropout để regularization tốt hơn khi dùng r=16
lora_target_modules: ".*conv.*|.*fc" # Mở rộng LoRA tối đa với class center initialization

# --- ArcFace / CosFace Margin Head (PartialFC) ---
embedding_size: 512
sample_rate: 1.0 
margin_list: [1.0, 0.3, 0.0] # Điểm giữa của 0.2 (train13) và 0.35 (train14), cân bằng nhất
interclass_filtering_threshold: 0

# --- Logging & Validation ---
verbose: 10 # Số step in ra log
val_targets: [] # Để trống nếu không dùng các tập test tiêu chuẩn lfw, cfp_fp...
using_wandb: false # Đổi thành true nếu muốn theo dõi trên Weights & Biases
