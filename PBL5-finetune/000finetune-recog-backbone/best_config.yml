# Fine-tune Config (Best từ Optuna HPO)

# --- Model & Dataset Paths ---
model_path: "models/pretrained/r50-ms1mv3.pth"
dataset_train_path: "dataset/train"
save_dir: "models/finetuned"

# --- Training Hyperparameters ---
batch_size: 64
epochs: 15
head_warmup_epochs: 2
learning_rate: 0.000083
weight_decay: 0.002740
optimizer: "adamw" 
num_workers: 0 
fp16: true 
gradient_acc: 1 

# --- LoRA Hyperparameters ---
use_lora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.08
lora_target_modules: ".*conv.*|fc"

# --- ArcFace / CosFace Margin Head (PartialFC) ---
embedding_size: 512
sample_rate: 1.0 
margin_list: [1.0, 0.43, 0.0]
interclass_filtering_threshold: 0

# --- Logging & Validation ---
verbose: 10
val_targets: []
using_wandb: false
